<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Meu Perfil</title>
</head>
<body>

    <main class="perfil-main">
        <section class="perfil-topo">
            <div class="avatar-container">
                <div class="avatar-perfil" id="avatar-inicial">U</div>
                <button type="button" class="btn-alterar-foto" title="Alterar Foto">&#128247;</button>
            </div>
            <h1 id="titulo-nome">Carregando...</h1>
            <p>Gerencie suas informações pessoais e preferências da conta</p>
        </section>

        <form id="perfil-form" class="perfil-form">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-salvar">Salvar Alterações</button>
                <button type="button" class="btn-cancelar" id="btn-logout">Sair da Conta</button>
            </div>
        </form>
    </main>
</body>
</html>
