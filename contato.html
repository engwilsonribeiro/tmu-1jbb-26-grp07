
<!DOCTYPE html> <!-- Define o documento como HTML5 -->
<html lang="pt-BR"> <!-- Define o idioma como português brasileiro -->

<head> <!-- Inicia as configurações da página -->
    <meta charset="UTF-8"> <!-- Permite usar acentos e caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta a página para celulares -->

    <link rel="stylesheet" href="./assets/css/contato.css"> <!-- Conecta o arquivo CSS -->
    <title>Meu Perfil</title> <!-- Define o título da aba do navegador -->
</head> <!-- Finaliza as configurações -->

<body> <!-- Inicia o conteúdo visível da página -->

    <main class="perfil-main"> <!-- Área principal do perfil -->

        <section class="perfil-topo"> <!-- Seção do cabeçalho do perfil -->

            <div class="avatar-container"> <!-- Área que contém a foto -->
                <div class="avatar-perfil" id="avatar-inicial"> <!-- Espaço da foto do usuário -->
                    foto
                </div>
            </div>

            <h1 id="titulo-nome">Meu Perfil</h1> <!-- Título principal do perfil -->

            <p> <!-- Inicia o texto de apresentação -->
                Gerencie suas informações pessoais
                e preferências da conta.
            </p> <!-- Finaliza o texto de apresentação -->

        </section> <!-- Finaliza o cabeçalho do perfil -->

        <form id="perfil-form" class="perfil-form"> <!-- Cria o formulário de dados -->

            <div class="form-group"> <!-- Agrupa o campo de nome -->
                <label for="nome">Nome completo:</label> <!-- Identifica o campo de nome -->

                <input
                    type="text" 
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required> <!-- Campo de texto obrigatório para o nome -->
            </div>

            <div class="form-group"> <!-- Agrupa o campo de e-mail -->
                <label for="email">E-mail:</label> <!-- Identifica o campo de e-mail -->

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required> <!-- Campo obrigatório que valida o formato do e-mail -->
            </div>

            <div class="form-group"> <!-- Agrupa o campo de telefone -->
                <label for="telefone">Telefone:</label> <!-- Identifica o campo de telefone -->

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    autocomplete="tel"> <!-- Campo para digitar o telefone -->
            </div>

            <div class="form-actions"> <!-- Agrupa os botões do formulário -->

                <button type="submit" class="btn-salvar"> <!-- Botão que envia o formulário -->
                    Salvar alterações
                </button>

                <button
                    type="button"
                    class="btn-cancelar"
                    id="btn-logout"> <!-- Botão preparado para sair da conta -->
                    Sair da conta
                </button>

            </div> <!-- Finaliza a área dos botões -->

        </form> <!-- Finaliza o formulário -->

    </main> <!-- Finaliza a área principal -->

</body> <!-- Finaliza o conteúdo da página -->

</html> <!-- Finaliza o documento HTML -->
